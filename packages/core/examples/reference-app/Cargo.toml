[package]
name = "elysium-reference-app"
description = "The reference app for df-elysium-core: every part of the SDK in one page, in the browser, on Elysium testnet."
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "BUSL-1.1"
authors = ["Dennis Furrer"]
publish = false

# Its own workspace: it builds for the browser only, and the SDK's checks never wait on it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
df-elysium-core = { path = "../..", default-features = false, features = ["sign", "web"] }
leptos = { version = "0.8.21", features = ["csr"] }
# Exact: the wasm-bindgen CLI must match.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Window", "Storage", "Crypto", "Navigator", "Clipboard"] }
serde_json = "1.0.151"
console_error_panic_hook = "0.1.7"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
# HYPE and token amounts are exact integers and decimals.
float_arithmetic = "deny"
# A panic kills the page.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
